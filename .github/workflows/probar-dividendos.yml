name: Probar dividendos vía Yahoo Finance

on:
  workflow_dispatch: {}   # solo se corre manualmente, no tiene horario

permissions:
  contents: write

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar la prueba
        run: python scripts/probar_dividendos.py

      - name: Guardar el resultado de la prueba
        run: |
          git config user.name "robot-cobre"
          git config user.email "actions@users.noreply.github.com"
          git add data/prueba_dividendos.json
          git diff --staged --quiet || git commit -m "Prueba: dividendos vía Yahoo Finance"
          git push
